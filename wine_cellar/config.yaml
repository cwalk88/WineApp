name: Wine Cellar
version: "0.1.0"
slug: wine_cellar
description: Photograph and catalogue your wine with Claude, and light up its slot on an LED wine rack
url: https://github.com/cwalk88/WineApp
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:bottle-wine
panel_title: Wine Cellar
homeassistant_api: true
options:
  anthropic_api_key: ""
  claude_model: claude-opus-5-5
  led_driver: esphome
  esphome_device: wine_rack
  wled_host: ""
  highlight_seconds: 90
  brightness: 80
  color_locate: "FFB000"
  color_checkin: "00FF40"
  color_suggest: "B000FF"
  publish_sensor: true
schema:
  anthropic_api_key: password
  claude_model: str
  led_driver: list(esphome|wled|none)
  esphome_device: str
  wled_host: str?
  highlight_seconds: int(0,3600)
  brightness: int(1,100)
  color_locate: match(^#?[0-9A-Fa-f]{6}$)
  color_checkin: match(^#?[0-9A-Fa-f]{6}$)
  color_suggest: match(^#?[0-9A-Fa-f]{6}$)
  publish_sensor: bool
